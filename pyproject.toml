[project]
name = "shavian-comics"
version = "0.1.0"
description = "Transliterate comic speech bubbles from English into the Shavian alphabet"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.0",
    "en-core-web-sm",
    "fastapi>=0.162.4",
    "numpy>=1.26",
    "onnxruntime>=1.31.1",
    "pillow>=10.0",
    "python-multipart>=0.0.33",
    "requests>=2.31",
    "scipy>=1.11",
    "spacy>=3.8.18",
    "torch>=2.5",
    "torchvision>=0.20",
    "tqdm>=4.66",
    "transformers>=4.51,<5",
    "ultralytics>=8.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

# CUDA wheels on Linux/Windows; default (CPU/MPS) wheels on macOS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
