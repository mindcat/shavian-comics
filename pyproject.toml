[project]
name = "shavian-comics"
version = "0.1.0"
description = "Transliterate comic speech bubbles from English into the Shavian alphabet"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "requests>=2.31",
    "scipy>=1.11",
    "torch>=2.5",
    "torchvision>=0.20",
    "tqdm>=4.66",
    "transformers>=4.51,<5",
    "ultralytics>=8.3",
]

[tool.uv]
package = false

# CUDA wheels on Linux/Windows; default (CPU/MPS) wheels on macOS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
