# Publishes the web tool to GitHub Pages as a fully static site: everything runs in
# the visitor's browser ("This device" mode). deploy/build_pages.sh downloads the
# models and dictionary at build time (checksums verified) into the site; nothing
# large is committed. The comic font (OFL 1.1) is hosted with the site.
#
# Optional: set the repository variable SHAVIAN_API to a server's URL to also offer
# "Server" mode. Settings > Pages > Source must be "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ["src/web/**", "src/shaw.py", "src/shavcomic/textproc.py", "deploy/build_pages.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: bash deploy/build_pages.sh _site "${{ vars.SHAVIAN_API }}"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
